name: WellWatch Prevent Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend Pytest, Migrations & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migration Check
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Test Suite with Coverage
        run: |
          python -m pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Run Automated Backup and Recovery Test
        run: |
          python backend/scripts/backup_restore.py --test-restore

  frontend-quality-and-build:
    name: Frontend Lint & Production Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps || npm install

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build

  container-security-and-build:
    name: Container Build & Configuration Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-quality-and-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: false
          tags: wellwatch-backend:ci-check

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: false
          tags: wellwatch-frontend:ci-check

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.staging.yml config > /dev/null
