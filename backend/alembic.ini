# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be considered as revisions
sourceless = false

# version location specification; this defaults
# to backend/alembic/versions.
version_locations = backend/alembic/versions

# the output encoding used when revisions are written from script.py.mako
output_encoding = utf-8

sqlalchemy.url = sqlite:///./data/wellwatch_prevent.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
