services:
  postgres:
    image: postgres:16-alpine
    container_name: wellwatch-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wellwatch_prevent}
      POSTGRES_USER: ${POSTGRES_USER:-wellwatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellwatch_secure_password_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wellwatch_user} -d ${POSTGRES_DB:-wellwatch_prevent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: wellwatch-dev-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      PROJECT_NAME: "WELLWATCH PREVENT (Dev)"
      SECRET_KEY: ${SECRET_KEY:-wellwatch-prevent-secure-development-secret-key-32chars-min}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-wellwatch_user}:${POSTGRES_PASSWORD:-wellwatch_secure_password_dev_only}@postgres:5432/${POSTGRES_DB:-wellwatch_prevent}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: wellwatch-dev-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dev_postgres_data:
    driver: local
