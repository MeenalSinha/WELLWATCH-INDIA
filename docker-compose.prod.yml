version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wellwatch-prod-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - prod_postgres_backups:/backups
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: wellwatch-prod-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ENVIRONMENT: production
      PROJECT_NAME: "WELLWATCH PREVENT — Abu Dhabi Production"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required and must exceed 32 characters}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-'["https://wellwatch.ae","https://app.wellwatch.ae"]'}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-'["wellwatch.ae","app.wellwatch.ae","backend"]'}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net
      - ingress-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: wellwatch-prod-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.wellwatch.ae/api/v1}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - ingress-net

volumes:
  prod_postgres_data:
    driver: local
  prod_postgres_backups:
    driver: local

networks:
  internal-net:
    internal: true
  ingress-net:
    driver: bridge
